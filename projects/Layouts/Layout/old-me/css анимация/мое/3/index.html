	<style>
	@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Work+Sans:ital,wght@1,500&display=swap');
body{
	margin: 0;
	padding: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	background: #000a01;
	font-family: 'Oswald', sans-serif;
	user-select: none;
}
a{
	position: relative;
	display: inline-block;
	padding: 15px 30px;
	color: #FF0000FF;
	letter-spacing: 10px;
	text-decoration: none;
	font-size: 16px;
	overflow: hidden;
	transition: .2s;
}
a:hover{
	color: #fff;
	background-color: #FF0000FF;
	box-shadow: 0 0 20px #FF0000FF,
	            0 0 40px #FF0000FF,
	            0 0 80px #FF0000FF;
	transition-delay: .3s;
	border-radius: 10px;
}
a span{
	position: absolute;
	display: block;
}
a span:nth-child(1){
	top: 0;
	left: -100%;
	width: 100%;
	height: 2px;
	background: linear-gradient(90deg, transparent, #FF0000FF);
	animation: an1 1s linear infinite;
}
a:hover span:nth-child(1){
left: 100%;
transition: .4s;
}
a span:nth-child(3){
	bottom: 0;
	right: -100%;
	width: 100%;
	height: 2px;
	background: linear-gradient(270deg, transparent, #FF0000FF);
	animation: an3 1s linear infinite;
    animation-delay: .5s
}
a:hover span:nth-child(3){
right: 100%;
transition: .4s;
transition-delay: .3s;
}
	a span:nth-child(2){
		top: -100%;
		right: 0;
		width: 2px;
		height: 100%;
		background: linear-gradient(180deg, transparent, #FF0000FF);
		animation: an2 1s linear infinite;
        animation-delay: .25s
	}
	a:hover span:nth-child(2){
		top: 100%;
	transition: .4s;
	transition-delay: .12s;
	}
	a span:nth-child(4){
		left: 0;
		bottom: -100%;
		width: 2px;
		height: 100%;
		background: linear-gradient(360deg, transparent, #FF0000FF);
		animation: an4 1s linear infinite;
        animation-delay: .75s

	}
@keyframes an1 {
  0% {
    left: -100%;

  50%,100% {
    left: 100%;
  }
}

@keyframes an2 {

}

@keyframes an4 {
