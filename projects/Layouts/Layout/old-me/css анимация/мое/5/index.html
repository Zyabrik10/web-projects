<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Кнопки с классным эфектом</title>
	<style>
		body {
			padding: 0;
			margin: 0;
			font-family: Arial, sans-serif;
		}

		.helper {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);

		}

		.button {
			position: relative;
			width: 300px;
			height: 60px;
			border: 4px solid #3f3adf;
			padding: 10px;
			font-size: 50px;
			color: #3f3adf;
			text-align: center;
			cursor: pointer;
			transition: .5s;
			z-index: 1;
			overflow: hidden;
		}

		.button:hover {
			color: #ffffff;
		}

		.button::before,
		.button::after {
			position: absolute;
			content: "";
			width: 100%;
			height: 100%;
			left: -100%;
			top: 0;
			background-color: #3f3adf;
			transition: .5s;
			z-index: -1;
		}

		.button::after {
			position: absolute;
			content: "";
			width: 100%;
			height: 100%;
			left: 0;
			top: 100%;
			background-color: #3f3adf;
			transition-delay: .2s;
		}

		.button:hover::before {
			left: 0;
			opacity: .4;
		}

		.button:hover::after {
			top: 0;
			opacity: .6;
		}

		.before-after {
			position: relative;
			width: 100%;
			height: 100%;
			border: none;
			color: #3f3adf;
			text-align: center;
			cursor: pointer;
			transition: .5s;
			z-index: 1;
			overflow: hidden;
		}

		.before-after::before,
		.before-after::after {
			position: absolute;
			content: "";
			width: 100%;
			height: 100%;
			left: 0;
			top: -100%;
			background-color: #3f3adf;
			transition: .5s;
			z-index: -1;
		}

		.before-after::after {
			left: 100%;
			top: 0;
		}

		.before-after:hover::before {
			top: 0;
			opacity: .8;
			transition-delay: .6s;
		}

		.before-after:hover::after {
			left: 0;
			opacity: .6;
			transition-delay: .4s;
		}

	</style>
</head>
